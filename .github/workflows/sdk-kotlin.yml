name: sdk-kotlin

on:
  push:
    branches: [main]
    paths:
      - 'sdk/kotlin/**'
      - '.github/workflows/sdk-kotlin.yml'
  pull_request:
    paths:
      - 'sdk/kotlin/**'
      - '.github/workflows/sdk-kotlin.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests de agent-core y sample-cli
        run: ./gradlew check
