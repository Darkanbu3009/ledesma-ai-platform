<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demo del widget — Ledesma AI Labs</title>
    <style>
      :root {
        --bg: #0f0f11;
        --surface: #1a1a1f;
        --border: #2a2a30;
        --text: #f2efe9;
        --muted: #a8a29a;
        --accent: #e5562a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 48px 24px 64px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
      }
      .sub {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 14px;
      }
      .sub code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: var(--text);
      }
      form {
        margin-top: 32px;
        padding: 24px;
        display: grid;
        gap: 16px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
      }
      label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 13px;
      }
      input {
        padding: 10px 12px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font: inherit;
        font-size: 14px;
        outline: none;
      }
      input:focus {
        border-color: var(--muted);
      }
      .warn {
        margin: 0;
        color: var(--accent);
        font-size: 12px;
      }
      button {
        justify-self: start;
        padding: 10px 18px;
        background: var(--accent);
        border: none;
        border-radius: 8px;
        color: var(--bg);
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(1.08);
      }
      #widget-slot {
        margin-top: 32px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Demo del widget — Ledesma AI Labs</h1>
      <p class="sub">
        Monta el web component <code>&lt;ledesma-agent&gt;</code> contra un agente de la
        plataforma.
      </p>
      <form id="mount-form">
        <label>
          Agent ID
          <input id="agent-id" type="text" placeholder="id del agente" autocomplete="off" required />
        </label>
        <label>
          API key del proveedor
          <input id="provider-key" type="password" placeholder="sk-..." autocomplete="off" />
        </label>
        <p class="warn">
          Solo para pruebas: en produccion la key vive en el servidor del cliente (modo proxy).
        </p>
        <button type="submit">Montar widget</button>
      </form>
      <div id="widget-slot"></div>
    </main>
    <script src="/widget/ledesma-agent.js"></script>
    <script src="/widget/demo.js"></script>
  </body>
</html>
